[project]
name = "mira-voice-ai-pipecat"
version = "0.1.0"
description = "Voice AI pipeline using Pipecat with Soniox STT and ElevenLabs TTS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pipecat Core (pinned for stable builds)
    "pipecat-ai[websocket,openai,silero,elevenlabs]==0.0.98",
    # FastAPI server (must be >=0.115.6 and <0.122.0 for pipecat-ai 0.0.98)
    "fastapi==0.115.6",
    "uvicorn==0.32.0",
    "python-dotenv==1.0.1",
    # WebSocket client for STT
    "websockets==14.0",
    # HTTP client for TTS (must be >=3.11.12 for pipecat-ai 0.0.98)
    "aiohttp==3.11.12",
    # Audio processing
    "numpy==1.26.4",
    "scipy==1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]
include = ["bot.py", "server.py", "benchmark.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]
