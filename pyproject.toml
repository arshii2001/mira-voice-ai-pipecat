[project]
name = "mita-voice-ai-pipecat"
version = "0.1.0"
description = "Voice AI pipeline using Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pipecat Core
    "pipecat-ai[websocket,openai,silero]>=0.0.70",
    # FastAPI server
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
    # WebSocket client for STT
    "websockets>=12.0",
    # HTTP client for TTS
    "aiohttp>=3.9.0",
    # Audio processing
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
