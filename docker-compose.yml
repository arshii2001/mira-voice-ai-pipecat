# ============================================
# MiraVoiceAI Local Testing Stack
# ============================================
# 
# Usage:
#   1. Copy env.example to .env and add your API keys
#   2. docker compose up --build
#   3. Open http://localhost:3000
#   4. Enable Pipecat in Admin Settings > Audio
#   5. Start a chat and click the call button
#
# ============================================

services:
  # ============================================
  # Pipecat Voice Backend
  # STT (Soniox) -> LLM (OpenAI) -> TTS (ElevenLabs)
  # ============================================
  mira-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira-voice
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - LOG_LEVEL=DEBUG
      - CURRICULUM_DIR=/content/curriculum
      - CURRICULUM_CONTEXT_MAX_TOKENS=600
      # Shared JWT secret with OpenWebUI — enables JWT auth on classroom endpoints
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    volumes:
      - ./prompts:/app/prompts:ro
      - classroom-data:/app/data
      - ./content/curriculum:/content/curriculum:ro
    networks:
      - mira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # OpenWebUI Frontend (with Pipecat support)
  # Using local build from mira_openwebui
  # ============================================
  open-webui:
    build:
      context: ../mira_openwebui
      dockerfile: Dockerfile
      args:
        - USE_SLIM=true  # Skip downloading large ML models for faster build
    container_name: mira-voice-webui
    ports:
      - "3005:8080"
    environment:
      # Pipecat Voice Integration
      - PIPECAT_ENABLED=true
      - PIPECAT_API_URL=http://localhost:7860
      - PIPECAT_CONNECTION_MODE=websocket
      
      # Enable real auth:
      # - First account can still be created as admin (initial bootstrap)
      # - Public signup stays disabled until admin enables it from Admin panel
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - ENABLE_INITIAL_ADMIN_SIGNUP=true
      # Shared JWT secret with Pipecat — must match WEBUI_SECRET_KEY above
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      
      # Use OpenAI for text chat
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE_URL=https://api.openai.com/v1
      
      # Ollama (if running locally)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - mira-network
    depends_on:
      mira-voice:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ============================================
  # Pipecat Voice Backend — Svara TTS variant
  # Mirrors the OSS/K8s deployment (Svara TTS + GPT-4o-mini)
  # for local A/B comparison against ElevenLabs above.
  #
  # Start:  docker compose up -d mira-voice-svara open-webui-svara
  # UI:     http://localhost:3006
  # Voice:  http://localhost:7861
  # ============================================
  mira-voice-svara:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira-voice-svara
    ports:
      - "7861:7860"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - LOG_LEVEL=DEBUG
      - CURRICULUM_DIR=/content/curriculum
      - CURRICULUM_CONTEXT_MAX_TOKENS=600
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      # ── Provider selectors come from .env via env_file above ──
      # To override: LLM_PROVIDER=groq docker compose up -d mira-voice-svara
    volumes:
      - ./prompts:/app/prompts:ro
      - classroom-data-svara:/app/data
      - ./content/curriculum:/content/curriculum:ro
    networks:
      - mira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-webui-svara:
    image: mira-voice-ai-pipecat-open-webui
    container_name: mira-voice-webui-svara
    ports:
      - "3006:8080"
    environment:
      - PIPECAT_ENABLED=true
      - PIPECAT_API_URL=http://localhost:7861
      - PIPECAT_CONNECTION_MODE=websocket
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - ENABLE_INITIAL_ADMIN_SIGNUP=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE_URL=https://api.openai.com/v1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - open-webui-data-svara:/app/backend/data
    networks:
      - mira-network
    depends_on:
      mira-voice-svara:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ============================================
  # Automated Voice Pipeline Test Client
  # Speaks RTVI/Protobuf protocol to mira-voice
  # ============================================
  #
  # Local tests (against Docker mira-voice):
  #   docker compose run --rm test-voice tests/run_all_tests.py
  #
  # OSS regression (against mira-oss.inf7ks8.com — Svara TTS + OSS LLM):
  #   docker compose run --rm test-oss
  #
  # ElevenLabs regression (against mira-ai.westus2.cloudapp.azure.com):
  #   docker compose run --rm test-elevenlabs
  #
  # Individual tests:
  #   docker compose run --rm test-voice tests/test_text_mode.py --test roundtrip_text --verbose
  #   docker compose run --rm test-oss tests/test_classroom_mode.py --test all --verbose
  #
  test-voice:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: mira-test-voice
    env_file:
      - .env
    environment:
      - PIPECAT_WS_URL=ws://mira-voice:7860/ws
      - PIPECAT_HTTP_URL=http://mira-voice:7860
      - CLASSROOM_WS_URL=ws://mira-voice:7860/classroom/rooms
      # Shared JWT secret — must match mira-voice for test auth
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    volumes:
      - ./tests/eval_audio_output:/app/tests/eval_audio_output
      - ./tests/stt_verify_output:/app/tests/stt_verify_output
    networks:
      - mira-network
    depends_on:
      mira-voice:
        condition: service_healthy
    profiles:
      - test  # Only runs when explicitly requested

  # ── OSS Regression Target (Svara TTS + OSS LLM) ──────────────
  # DEFAULT regression target — run this regularly
  test-oss:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: mira-test-oss
    entrypoint: ["python", "tests/run_all_tests.py", "--target", "oss"]
    env_file:
      - .env
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    networks:
      - mira-network
    profiles:
      - test

  # ── ElevenLabs Regression Target (GPT-4o-mini + ElevenLabs) ──
  # Run occasionally to verify ElevenLabs deployment
  test-elevenlabs:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: mira-test-elevenlabs
    entrypoint: ["python", "tests/run_all_tests.py", "--target", "elevenlabs"]
    env_file:
      - .env
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    networks:
      - mira-network
    profiles:
      - test

  # ============================================
  # Text-Audio Sync Soak Test (30-minute drift test)
  # Run with: docker compose run --rm soak-test-oss
  # Quick:    docker compose run --rm soak-test-oss --quick
  # ============================================
  soak-test-oss:
    build:
      context: .
      dockerfile: soak_test/Dockerfile
    container_name: mira-soak-test-oss
    entrypoint: ["python", "soak_test/run_soak_test.py", "--target", "oss"]
    env_file:
      - .env
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    volumes:
      - ./soak_test/output:/app/soak_test/output
    networks:
      - mira-network
    profiles:
      - test

  soak-test-elevenlabs:
    build:
      context: .
      dockerfile: soak_test/Dockerfile
    container_name: mira-soak-test-elevenlabs
    entrypoint: ["python", "soak_test/run_soak_test.py", "--target", "elevenlabs"]
    env_file:
      - .env
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    volumes:
      - ./soak_test/output:/app/soak_test/output
    networks:
      - mira-network
    profiles:
      - test

  soak-test-local:
    build:
      context: .
      dockerfile: soak_test/Dockerfile
    container_name: mira-soak-test-local
    entrypoint: ["python", "soak_test/run_soak_test.py", "--target", "local"]
    env_file:
      - .env
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    volumes:
      - ./soak_test/output:/app/soak_test/output
    networks:
      - mira-network
    depends_on:
      mira-voice:
        condition: service_healthy
    profiles:
      - test

  # ============================================
  # Cypress E2E UI Tests
  # Run with: docker compose run --rm test-ui
  # Or:       docker compose run --rm test-ui --spec "cypress/e2e/classroom_teacher.cy.ts"
  # ============================================
  test-ui:
    build:
      context: ../mira_openwebui
      dockerfile: cypress/Dockerfile
    container_name: mira-test-ui
    environment:
      - CYPRESS_baseUrl=http://open-webui:8080
    networks:
      - mira-network
    depends_on:
      mira-voice:
        condition: service_healthy
      open-webui:
        condition: service_started
    profiles:
      - test  # Only runs when explicitly requested

networks:
  mira-network:
    driver: bridge

volumes:
  open-webui-data:
  classroom-data:
  open-webui-data-svara:
  classroom-data-svara:
