# =============================================================
# Let's Encrypt ClusterIssuer (production)
# =============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: prasad@inflectionai.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# =============================================================
# OpenWebUI v2 — serves at /
# =============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui-v2-nginx
  namespace: openwebui
  labels:
    app: openwebui-v2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mira-ai.westus2.cloudapp.azure.com
      secretName: mira-ai-tls
  rules:
    - host: mira-ai.westus2.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwebui-v2-service
                port:
                  number: 8080

---
# =============================================================
# Pipecat v2 — serves at /pipecat/, path stripped to /
# =============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipecat-v2-nginx
  namespace: openwebui
  labels:
    app: pipecat-v2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support
    nginx.ingress.kubernetes.io/enable-websockets: "true"
    # Strip /pipecat prefix before forwarding
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://mira-ai.westus2.cloudapp.azure.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-User-Id, X-User-Name, X-User-Email, X-User-Role"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mira-ai.westus2.cloudapp.azure.com
      secretName: mira-ai-tls
  rules:
    - host: mira-ai.westus2.cloudapp.azure.com
      http:
        paths:
          - path: /pipecat(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pipecat-v2-service
                port:
                  number: 7860
