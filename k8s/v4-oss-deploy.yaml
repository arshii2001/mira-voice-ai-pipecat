# ============================================================
# Mira v4-oss Deployment - Pipecat + OpenWebUI (OSS models)
# Namespace: openwebui
# ============================================================

---
# ── Pipecat v4-oss ConfigMap ──────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipecat-v4-oss-config
  namespace: openwebui
  labels:
    app: pipecat-v4-oss
data:
  STT_PROVIDER: "soniox"
  STT_LANGUAGE_HINTS: "en,hi,ta,kn"
  TTS_PROVIDER: "svara"
  TTS_WS_URL: "ws://vllm-svara-ext.bbf23a-prod-cw-1.coreweave.app/v1/audio/text-to-speech/stream"
  TTS_SAMPLE_RATE: "24000"
  DEFAULT_VOICE: "en_female"
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  HOST: "0.0.0.0"
  PORT: "7860"
  LOG_LEVEL: "INFO"
  PROMPT_VERSION: "v4"
  CURRICULUM_CONTEXT_MAX_TOKENS: "600"

---
# ── OpenWebUI v4-oss ConfigMap ────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-v4-oss-config
  namespace: openwebui
  labels:
    app: openwebui-v4-oss
data:
  PIPECAT_ENABLED: "true"
  PIPECAT_API_URL: "https://mira-oss.inf7ks8.com/pipecat"
  PIPECAT_CONNECTION_MODE: "websocket"
  WEBUI_AUTH: "true"
  ENABLE_SIGNUP: "false"
  ENABLE_PERSISTENT_CONFIG: "false"
  SHOW_ADMIN_DETAILS: "false"
  ENABLE_UPDATE_CHECK: "false"

---
# ── OpenWebUI v4-oss PVC ─────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-v4-oss-data-pvc
  namespace: openwebui
  labels:
    app: openwebui-v4-oss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ── Pipecat v4-oss Unified Data PVC ──────────────────────────
# Stores prompts, curriculum JSONs, and classroom SQLite DB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipecat-v4-oss-data-pvc
  namespace: openwebui
  labels:
    app: pipecat-v4-oss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ── Pipecat v4-oss Deployment ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipecat-v4-oss
  namespace: openwebui
  labels:
    app: pipecat-v4-oss
spec:
  replicas: 1
  strategy:
    type: Recreate          # Required for ReadWriteOnce PVC
  selector:
    matchLabels:
      app: pipecat-v4-oss
  template:
    metadata:
      labels:
        app: pipecat-v4-oss
    spec:
      imagePullSecrets:
        - name: acr-iaienterpriseacr
      # ── Init container: seed PVC with defaults if empty ──────
      initContainers:
        - name: seed-data
          image: iaienterpriseacr.azurecr.io/audio:mira-voice-v3.28
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[init] Seeding PVC data..."
              # Prompts: always overwrite with latest from image
              echo "[init] Copying prompts (always update)..."
              mkdir -p /pipecat-data/prompts
              cp -v /app/prompts/*.md /pipecat-data/prompts/
              # Curriculum: copy only if dir is empty / missing
              if [ ! -f /pipecat-data/curriculum/ncert_science_10.json ]; then
                echo "[init] Copying default curriculum..."
                mkdir -p /pipecat-data/curriculum
                cp -v /app/content/curriculum/*.json /pipecat-data/curriculum/ 2>/dev/null || true
              else
                echo "[init] Curriculum already exists, skipping."
              fi
              # Data dir for SQLite
              mkdir -p /pipecat-data/data
              echo "[init] Done."
          volumeMounts:
            - name: pipecat-data
              mountPath: /pipecat-data
      containers:
        - name: pipecat-v4-oss
          image: iaienterpriseacr.azurecr.io/audio:mira-voice-v3.28
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pipecat-v4-oss-config
            - secretRef:
                name: pipecat-v4-oss-secrets
          env:
            # Shared JWT secret with OpenWebUI
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mira-shared-secrets
                  key: WEBUI_SECRET_KEY
            # ── Paths pointing into the PVC ──
            - name: PROMPT_DIR
              value: /pipecat-data/prompts
            - name: CURRICULUM_DIR
              value: /pipecat-data/curriculum
            - name: CLASSROOM_DB_PATH
              value: /pipecat-data/data/classroom.db
          volumeMounts:
            # Mount the full PVC at /pipecat-data
            - name: pipecat-data
              mountPath: /pipecat-data
            # Also shadow the built-in /app/prompts with PVC contents
            # so the hardcoded PROMPT_DIR in older images still works
            - name: pipecat-data
              mountPath: /app/prompts
              subPath: prompts
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: pipecat-data
          persistentVolumeClaim:
            claimName: pipecat-v4-oss-data-pvc

---
# ── Pipecat v4-oss ClusterIP Service ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pipecat-v4-oss-service
  namespace: openwebui
  labels:
    app: pipecat-v4-oss
spec:
  type: ClusterIP
  selector:
    app: pipecat-v4-oss
  ports:
    - port: 7860
      targetPort: 7860
      protocol: TCP

---
# ── OpenWebUI v4-oss Deployment ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-v4-oss
  namespace: openwebui
  labels:
    app: openwebui-v4-oss
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui-v4-oss
  template:
    metadata:
      labels:
        app: openwebui-v4-oss
    spec:
      imagePullSecrets:
        - name: acr-iaienterpriseacr
      containers:
        - name: openwebui-v4-oss
          image: iaienterpriseacr.azurecr.io/audio:mira-openwebui-v3.8
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PIPECAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: PIPECAT_ENABLED
            - name: PIPECAT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: PIPECAT_API_URL
            - name: PIPECAT_CONNECTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: PIPECAT_CONNECTION_MODE
            - name: WEBUI_AUTH
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: WEBUI_AUTH
            - name: ENABLE_SIGNUP
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: ENABLE_SIGNUP
            - name: ENABLE_PERSISTENT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: ENABLE_PERSISTENT_CONFIG
            - name: SHOW_ADMIN_DETAILS
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: SHOW_ADMIN_DETAILS
            - name: ENABLE_UPDATE_CHECK
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v4-oss-config
                  key: ENABLE_UPDATE_CHECK
            # Shared JWT secret with Pipecat
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mira-shared-secrets
                  key: WEBUI_SECRET_KEY
            - name: DATA_DIR
              value: /app/backend/data
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-v4-oss-data-pvc

---
# ── OpenWebUI v4-oss ClusterIP Service ───────────────────────
apiVersion: v1
kind: Service
metadata:
  name: openwebui-v4-oss-service
  namespace: openwebui
  labels:
    app: openwebui-v4-oss
spec:
  type: ClusterIP
  selector:
    app: openwebui-v4-oss
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
