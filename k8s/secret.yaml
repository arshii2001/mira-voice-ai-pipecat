# =============================================================
# Mira API Keys Secret
# =============================================================
# USAGE:
#   1. Copy this file: cp secret.yaml secret-local.yaml
#   2. Fill in your base64-encoded keys in secret-local.yaml
#   3. Apply: kubectl apply -f secret-local.yaml
#
# To base64-encode a key:
#   echo -n "your-api-key-here" | base64
#
# IMPORTANT: Never commit secret-local.yaml to git!
# =============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mira-voice-secrets
  namespace: mira
  labels:
    app.kubernetes.io/part-of: mira
    app.kubernetes.io/component: voice-backend
type: Opaque
data:
  # STT - Soniox (required)
  SONIOX_API_KEY: ""          # echo -n "your-soniox-key" | base64

  # TTS - ElevenLabs (required if TTS_PROVIDER=elevenlabs)
  ELEVENLABS_API_KEY: ""      # echo -n "your-elevenlabs-key" | base64

  # LLM - OpenAI or compatible (required)
  LLM_API_KEY: ""             # echo -n "your-llm-api-key" | base64
  OPENAI_API_KEY: ""          # echo -n "your-openai-key" | base64

  # TTS - Svara (optional, if TTS_PROVIDER=svara)
  # TTS_WS_API_KEY: ""        # echo -n "your-svara-key" | base64

  # Deepgram (optional, if STT_PROVIDER=deepgram)
  # DEEPGRAM_API_KEY: ""      # echo -n "your-deepgram-key" | base64
