# ============================================================
# Mira v3.0 Deployment - Pipecat + OpenWebUI
# Namespace: openwebui
# Images: iaienterpriseacr.azurecr.io/audio:mira-voice-v3.0
#         iaienterpriseacr.azurecr.io/audio:mira-openwebui-v3.0
# ============================================================

---
# ── Pipecat v2 ConfigMap (non-sensitive overrides) ───────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipecat-v2-config
  namespace: openwebui
  labels:
    app: pipecat-v2
data:
  STT_PROVIDER: "soniox"
  STT_LANGUAGE_HINTS: "en,hi,ta"
  TTS_PROVIDER: "elevenlabs"
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  HOST: "0.0.0.0"
  PORT: "7860"
  LOG_LEVEL: "INFO"
  PROMPT_VERSION: "v4"
  CURRICULUM_CONTEXT_MAX_TOKENS: "600"

---
# ── OpenWebUI v2 ConfigMap ───────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-v2-config
  namespace: openwebui
  labels:
    app: openwebui-v2
data:
  PIPECAT_ENABLED: "true"
  PIPECAT_API_URL: "https://mira-ai.westus2.cloudapp.azure.com/pipecat"
  PIPECAT_CONNECTION_MODE: "websocket"
  WEBUI_AUTH: "true"
  ENABLE_SIGNUP: "false"
  ENABLE_PERSISTENT_CONFIG: "false"
  SHOW_ADMIN_DETAILS: "false"
  ENABLE_UPDATE_CHECK: "false"

---
# ── OpenWebUI v2 PVC ────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openwebui-v2-data-pvc
  namespace: openwebui
  labels:
    app: openwebui-v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ── Pipecat v2 Unified Data PVC ───────────────────────────────
# Stores prompts, curriculum JSONs, and classroom SQLite DB
# so they persist across pod restarts and can be edited externally
# via: kubectl cp <local-file> <pod>:/pipecat-data/<path>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipecat-v2-data-pvc
  namespace: openwebui
  labels:
    app: pipecat-v2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# ── Pipecat v2 Deployment ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipecat-v2
  namespace: openwebui
  labels:
    app: pipecat-v2
spec:
  replicas: 1
  strategy:
    type: Recreate          # Required for ReadWriteOnce PVC
  selector:
    matchLabels:
      app: pipecat-v2
  template:
    metadata:
      labels:
        app: pipecat-v2
    spec:
      imagePullSecrets:
        - name: acr-iaienterpriseacr
      # ── Init container: seed PVC with defaults if empty ──────
      initContainers:
        - name: seed-data
          image: iaienterpriseacr.azurecr.io/audio:mira-voice-v3.29
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[init] Seeding PVC data..."
              # Prompts: always copy to ensure latest versions are used
              echo "[init] Copying prompts (always update)..."
              mkdir -p /pipecat-data/prompts
              cp -fv /app/prompts/*.md /pipecat-data/prompts/
              # Curriculum: copy only if dir is empty / missing
              if [ ! -f /pipecat-data/curriculum/ncert_science_10.json ]; then
                echo "[init] Copying default curriculum..."
                mkdir -p /pipecat-data/curriculum
                cp -v /app/content/curriculum/*.json /pipecat-data/curriculum/ 2>/dev/null || true
              else
                echo "[init] Curriculum already exists, skipping."
              fi
              # Data dir for SQLite
              mkdir -p /pipecat-data/data
              echo "[init] Done."
          volumeMounts:
            - name: pipecat-data
              mountPath: /pipecat-data
      containers:
        - name: pipecat-v2
          image: iaienterpriseacr.azurecr.io/audio:mira-voice-v3.29
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
              protocol: TCP
          env:
            - name: STT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: STT_PROVIDER
            - name: STT_LANGUAGE_HINTS
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: STT_LANGUAGE_HINTS
            - name: TTS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: TTS_PROVIDER
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: LLM_PROVIDER
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: LLM_BASE_URL
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: LLM_MODEL
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: LOG_LEVEL
            - name: PROMPT_VERSION
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: PROMPT_VERSION
            - name: CURRICULUM_CONTEXT_MAX_TOKENS
              valueFrom:
                configMapKeyRef:
                  name: pipecat-v2-config
                  key: CURRICULUM_CONTEXT_MAX_TOKENS
            # ── Shared JWT secret with OpenWebUI ──
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mira-shared-secrets
                  key: WEBUI_SECRET_KEY
            # ── STT API key (Soniox) ──
            - name: SONIOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pipecat-v2-secrets
                  key: SONIOX_API_KEY
            # ── Paths pointing into the PVC ──
            - name: PROMPT_DIR
              value: /pipecat-data/prompts
            - name: CURRICULUM_DIR
              value: /pipecat-data/curriculum
            - name: CLASSROOM_DB_PATH
              value: /pipecat-data/data/classroom.db
          volumeMounts:
            # Mount the full PVC at /pipecat-data
            - name: pipecat-data
              mountPath: /pipecat-data
            # Also shadow the built-in /app/prompts with PVC contents
            # so the hardcoded PROMPT_DIR in older images still works
            - name: pipecat-data
              mountPath: /app/prompts
              subPath: prompts
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            tcpSocket:
              port: 7860
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 7860
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: pipecat-data
          persistentVolumeClaim:
            claimName: pipecat-v2-data-pvc

---
# ── Pipecat v2 ClusterIP Service ────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pipecat-v2-service
  namespace: openwebui
  labels:
    app: pipecat-v2
spec:
  type: ClusterIP
  selector:
    app: pipecat-v2
  ports:
    - port: 7860
      targetPort: 7860
      protocol: TCP

---
# ── Pipecat v2 Tailscale Ingress (HTTPS with auto TLS) ──────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipecat-v2-tailscale-ingress
  namespace: openwebui
  labels:
    app: pipecat-v2
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pipecat-v2-service
      port:
        number: 7860
  tls:
    - hosts:
        - pipecat-v2-api

---
# ── OpenWebUI v2 Deployment ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui-v2
  namespace: openwebui
  labels:
    app: openwebui-v2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openwebui-v2
  template:
    metadata:
      labels:
        app: openwebui-v2
    spec:
      imagePullSecrets:
        - name: acr-iaienterpriseacr
      containers:
        - name: openwebui-v2
          image: iaienterpriseacr.azurecr.io/audio:mira-openwebui-v3.7
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PIPECAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: PIPECAT_ENABLED
            - name: PIPECAT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: PIPECAT_API_URL
            - name: PIPECAT_CONNECTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: PIPECAT_CONNECTION_MODE
            - name: WEBUI_AUTH
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: WEBUI_AUTH
            - name: ENABLE_SIGNUP
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: ENABLE_SIGNUP
            - name: ENABLE_PERSISTENT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: ENABLE_PERSISTENT_CONFIG
            - name: SHOW_ADMIN_DETAILS
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: SHOW_ADMIN_DETAILS
            - name: ENABLE_UPDATE_CHECK
              valueFrom:
                configMapKeyRef:
                  name: openwebui-v2-config
                  key: ENABLE_UPDATE_CHECK
            # Shared JWT secret with Pipecat — must match WEBUI_SECRET_KEY above
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mira-shared-secrets
                  key: WEBUI_SECRET_KEY
            - name: DATA_DIR
              value: /app/backend/data
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-v2-data-pvc

---
# ── OpenWebUI v2 ClusterIP Service ──────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: openwebui-v2-service
  namespace: openwebui
  labels:
    app: openwebui-v2
spec:
  type: ClusterIP
  selector:
    app: openwebui-v2
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

---
# ── OpenWebUI v2 Tailscale Ingress (HTTPS with auto TLS) ────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui-v2-tailscale-ingress
  namespace: openwebui
  labels:
    app: openwebui-v2
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openwebui-v2-service
      port:
        number: 8080
  tls:
    - hosts:
        - openwebui-v2
